plugins {
  id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
  id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

def jarProjects = project(':jars').subprojects
def toastProjects = project(':toasts').subprojects

toastProjects.each { it.ext.mc = it.name }
jarProjects.each {
  it.ext.mcVersions = it.property('minecraft_versions').split(',') as List
  it.ext.toastNames = it.property('toasts').split(',') as List
  it.ext.mc = it.mcVersions.first()
}

configure(jarProjects + toastProjects) {
  def unobfuscated = mc.startsWith('26.')
  ext.javaRelease = unobfuscated ? 25 : 21

  apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

  group = rootProject.maven_group

  dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (unobfuscated) {
      implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    } else {
      mappings loom.officialMojangMappings()
      modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    }
  }

  java {
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
  }

  tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease
    options.encoding = 'UTF-8'
  }

  ext.loomJar = tasks.named(unobfuscated ? 'jar' : 'remapJar')
}

configure(toastProjects) {
  sourceSets.main.java {
    srcDir rootProject.file('src/common/java')
    exclude 'com/larry6/patcher/mixin/**'
  }
}

configure(jarProjects) {
  version = "${rootProject.mod_version}+${project.name}"
  base.archivesName = rootProject.archives_base_name

  sourceSets.main {
    java.srcDirs = [rootProject.file('src/fix/java'), rootProject.file('src/common/java')]
    resources.srcDirs = [
      rootProject.file('src/fix/resources'),
      rootProject.file('src/common/resources'),
    ]
  }

  processResources {
    def props = [
      version: rootProject.mod_version,
      minecraft: groovy.json.JsonOutput.toJson(mcVersions),
      toasts: groovy.json.JsonOutput.toJson(toastNames),
      java: javaRelease,
    ]
    inputs.properties(props)
    filesMatching(['fabric.mod.json', '*.mixins.json']) { expand(props) }
  }

  tasks.register('bundleJar', Zip) {
    def toastJars = toastNames.collect { project(":toasts:${it}").loomJar }
    dependsOn(loomJar, toastJars)
    archiveFileName = loomJar.flatMap { it.archiveFileName }
    destinationDirectory = layout.buildDirectory.dir('bundle')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(loomJar.map { jar -> zipTree(jar.archiveFile) })
    toastJars.each { toastJar ->
      from(toastJar.map { jar -> zipTree(jar.archiveFile) }) {
        include 'com/larry6/patcher/toast/**'
      }
    }
  }
}

tasks.register('collectJars', Sync) {
  jarProjects.each { p -> from(p.tasks.named('bundleJar')) }
  into layout.buildDirectory.dir('libs')
}
