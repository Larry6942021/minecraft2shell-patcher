pluginManagement {
  repositories {
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

rootProject.name = 'minecraft2shell-patcher'

// One subproject per supported Minecraft version. Each folder only holds a
// gradle.properties file that names its toast source folder.
file('versions').eachDir { include(":versions:${it.name}") }
